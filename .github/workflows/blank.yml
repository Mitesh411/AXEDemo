name: Pa11y Accessibility Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pa11y:
    runs-on: ubuntu-latest
    env:
      # Opt into Node.js 24 for GitHub Actions to avoid deprecation warnings for actions using Node.js 20.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run local server
        run: |
          npm run start &
          sleep 5

      - name: Run Pa11y CI
        run: npm run a11y -- --json > pa11y-report.json

      - name: Upload Pa11y report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pa11y-report
          path: pa11y-report.json
